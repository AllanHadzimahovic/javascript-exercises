<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list example</title>
    <style>
      li {
        margin-bottom: 10px;
      }

      li button {
        font-size: 12px;
        margin-left: 20px;
        color: #666;
      }
    </style>
  </head>
  <body>

    <h1>My shopping list</h1>

    <form>
      <label for="item">Enter a new item:</label>
      <input type="text" name="item" id="item">
      <button>Add item</button>
    </form>

    <ul>

    </ul>

    <script>
        let ulV = document.querySelector("ul");
        let inputV = document.querySelector("input");
        let buttonV = document.querySelector("button");

        buttonV.addEventListener('click', hello)

        function hello(event){
            event.preventDefault();
            const input = inputV.value;
            inputV.value = "";
            var listV = document.createElement("li");
            var spanV = document.createElement("span");
            var buttonVV = document.createElement("button");
            
            buttonVV.textContent = "Delete";
            spanV.textContent = input;
        
            buttonVV.addEventListener('click',() =>listV.remove())
            
           listV.appendChild(spanV);
           listV.appendChild(buttonVV);
           ulV.appendChild(listV);

           inputV.focus();
        }
        
         

    </script>
  </body>
</html>
